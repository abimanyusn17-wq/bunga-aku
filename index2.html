 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>flowers</title>
<style>body{margin:0;background:#000;overflow:hidden;height:100vh;display:flex;justify-content:center;align-items:center}.night{position:absolute;width:100%;height:100%;background:radial-gradient(ellipse at bottom,#1b2735 0%,#090a0f 100%)}.flowers{position:relative;transform:scale(0.8)}.flower{position:absolute;bottom:10vmin}.flower--1{left:20vmin;animation:move 8s infinite}.flower--2{left:40vmin;animation:move 9s infinite}.flower--3{left:60vmin;animation:move 7s infinite}@keyframes move{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-2vmin) rotate(2deg)}}.flower__leafs{position:relative;width:8vmin;height:8vmin;background:radial-gradient(circle,#ffae00,#ff6b00);border-radius:50%;box-shadow:0 0 20px #ffae00}.flower__leaf{position:absolute;width:6vmin;height:6vmin;background:#ff6b00;border-radius:50%;transform-origin:center}.flower__leaf--1{transform:translate(-50%,-100%)}.flower__leaf--2{transform:translate(50%,-50%) rotate(90deg)}.flower__leaf--3{transform:translate(0,0) rotate(180deg)}.flower__leaf--4{transform:translate(-50%,50%) rotate(270deg)}.flower__white-circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2vmin;height:2vmin;background:#fff;border-radius:50%}.flower__line{width:1vmin;height:20vmin;background:linear-gradient(to bottom,#0a5c0a,#0f8a0f);margin:0 auto;border-radius:1vmin}</style>
</head>
<body>
<div class="night"></div>
<div class="flowers">
<div class="flower flower--1"><div class="flower__leafs"><div class="flower__leaf flower__leaf--1"></div><div class="flower__leaf flower__leaf--2"></div><div class="flower__leaf flower__leaf--3"></div><div class="flower__leaf flower__leaf--4"></div><div class="flower__white-circle"></div></div><div class="flower__line"></div></div>
<div class="flower flower--2"><div class="flower__leafs"><div class="flower__leaf flower__leaf--1"></div><div class="flower__leaf flower__leaf--2"></div><div class="flower__leaf flower__leaf--3"></div><div class="flower__leaf flower__leaf--4"></div><div class="flower__white-circle"></div></div><div class="flower__line"></div></div>
<div class="flower flower--3"><div class="flower__leafs"><div class="flower__leaf flower__leaf--1"></div><div class="flower__leaf flower__leaf--2"></div><div class="flower__leaf flower__leaf--3"></div><div class="flower__leaf flower__leaf--4"></div><div class="flower__white-circle"></div></div><div class="flower__line"></div></div>
</div>
</body>
</html>
